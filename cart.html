<script>
  var cartCount= Number (localStorage.getItem("cartCount")) || 0;
  document.getElementById("cart-count").textContent = cartCount;
  document.getElementById("cartHeaderCount").textContent = cartCount;

 function OnButtonClick() {
  cartCount++;
  localStorage.setItem("cartCount", cartCount);
  document.getElementById("cart-count").textContent = cartCount;
}

function removeItem() {
    if(cartCount > 0){
        cartCount--;
        localStorage.setItem("cartCount", cartCount);
        document.getElementById("cart-count").textContent = cartCount;
        loadCart();
         document.getElementById("cart-count").textContent = cartCount;
         document.getElementById("cartHeaderCount").textContent = cartCount;

    }
}


function loadCart() {
    var cartContents = document.getElementById
("cart-contents");

cartContents.innerHTML="";

if(cartCount === 0){
    //the cart is empty
    cartContents.innerHTML = "<p>Your cart is empty.</p>";
    return;

}

var html = "";

for(var i = 0; i < cartCount; i++){
    // build our html

    html +=` <div class="padding cart-item">
            <h2>Product Name</h2>
            <p>Product Description</p>
            <p>Price: $29.99</p>
             <button onclick="removeItem()">Remove</button>
        </div>`;
   
    }
    
    cartContents.innerHTML = html;
}
loadCart();

</script>
